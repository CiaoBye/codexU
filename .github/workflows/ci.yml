name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build
      - name: Palette package and rendering tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-palettes
      - name: Menu bar rendering tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-status-item
      - name: Particle animation tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-particle-animation
      - name: Claude Desktop cache self-test
        run: build/codexU.app/Contents/MacOS/codexU --self-test-claude-desktop-cache
      - name: GPT-6 pricing and reasoning attribution tests
        run: |
          build/codexU.app/Contents/MacOS/codexU --self-test-model-pricing
          build/codexU.app/Contents/MacOS/codexU --self-test-model-usage-trend
      - name: Rate limit tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-rate-limits
      - name: Statistics time zone tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-statistics-time-zone

  windows-rust-format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check Windows Rust formatting
        working-directory: windows
        run: cargo fmt --all -- --check
      - name: Test Windows Rust workspace
        working-directory: windows
        run: cargo test --workspace

  windows-web:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows/apps/codexu-tauri/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/apps/codexu-tauri/web/package-lock.json
      - name: Install Windows Web dependencies
        run: npm ci
      - name: Build Windows Web
        run: npm run build
      - name: Test Windows Web contracts
        run: npm run test:contracts


  beta-package:
    if: github.event_name == 'pull_request'
    needs: macos
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build coexistence-safe Apple Silicon beta
        run: make dev-dmg-arm64
      - name: Create checksum
        run: shasum -a 256 dist-next/codexUNext-1.4.0-beta.1-mac-arm64.dmg > dist-next/codexUNext-1.4.0-beta.1-mac-arm64.dmg.sha256
      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexu-next-1.4.0-beta.1-macos-arm64
          path: |
            dist-next/codexUNext-1.4.0-beta.1-mac-arm64.dmg
            dist-next/codexUNext-1.4.0-beta.1-mac-arm64.dmg.sha256
          if-no-files-found: error
