name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build
      - name: Palette package and rendering tests
        run: ./scripts/test-palettes.sh
      - name: Menu bar rendering tests
        run: ./scripts/test-status-item.sh
      - name: Particle animation tests
        run: ./scripts/test-particle-animation.sh
      - name: Claude Desktop cache self-test
        run: build/codexU.app/Contents/MacOS/codexU --self-test-claude-desktop-cache
      - name: GPT-6 pricing and reasoning attribution tests
        run: |
          build/codexU.app/Contents/MacOS/codexU --self-test-model-pricing
          build/codexU.app/Contents/MacOS/codexU --self-test-model-usage-trend
      - name: Rate limit tests
        run: ./scripts/test-rate-limits.sh
      - name: Statistics time zone tests
        run: ./scripts/test-statistics-time-zone.sh

  windows-rust-format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check Windows Rust formatting
        working-directory: windows
        run: cargo fmt --all -- --check
      - name: Test Windows Rust workspace
        working-directory: windows
        run: cargo test --workspace

  windows-web:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows/apps/codexu-tauri/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/apps/codexu-tauri/web/package-lock.json
      - name: Install Windows Web dependencies
        run: npm ci
      - name: Build Windows Web
        run: npm run build
      - name: Test Windows Web contracts
        run: npm run test:contracts
